name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so commitlint can lint the PR commit range.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/393031adb9afb225ee52ae2ccd7a5af5525e03e8/scripts/download-actionlint.bash) 1.7.11 "$RUNNER_TEMP"
          ACTIONLINT_BIN="$RUNNER_TEMP/actionlint"
          "$ACTIONLINT_BIN" -version
          echo "ACTIONLINT_BIN=$ACTIONLINT_BIN" >> "$GITHUB_ENV"
      # Bundle once before fan-out so pack tests and the dist assert only read
      # dist/. Typecheck stays in the fan-out so it runs exactly once.
      - run: npm run bundle
      # Keep at most two checks active on the two-vCPU runner. Failures aggregate
      # under ::group:: logs so one pass still shows every result.
      - name: Run gates
        run: |
          set -uo pipefail
          declare -A pid=()
          declare -A result=()
          declare -a names=()
          MAX_PARALLEL_GATES=2
          finish_one() {
            local finished_pid status n
            if wait -n -p finished_pid "${pid[@]}"; then status=0; else status=$?; fi
            for n in "${!pid[@]}"; do
              if [ "${pid[$n]}" = "$finished_pid" ]; then
                result[$n]=$status
                unset 'pid[$n]'
                return
              fi
            done
          }
          run() {
            while [ "${#pid[@]}" -ge "$MAX_PARALLEL_GATES" ]; do finish_one; done
            local n=$1; shift
            names+=("$n")
            ( "$@" ) >"$n.log" 2>&1 & pid[$n]=$!
          }

          run lint       npm run lint
          run typecheck  npm run typecheck
          run test       npm test
          run dist-shape npm run verify:dist:shape
          run actionlint "$ACTIONLINT_BIN"
          run docs-pins  npm run docs:pins
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            run commitlint npx commitlint \
              --from "${{ github.event.pull_request.base.sha }}" \
              --to "${{ github.event.pull_request.head.sha }}"
          fi

          while [ "${#pid[@]}" -gt 0 ]; do finish_one; done
          fail=0
          for n in "${names[@]}"; do
            if [ "${result[$n]}" -eq 0 ]; then echo "gate:$n=pass"; else echo "gate:$n=fail"; fail=1; fi
          done
          for n in "${names[@]}"; do
            echo "::group::$n"; cat "$n.log"; echo "::endgroup::"
          done
          exit $fail
      - name: AWS emulator transport lane
        # Budgeted LocalStack lane (cap 47.3s measured wall-clock): proves the
        # shipped dist/cli.cjs speaks real SDK wire protocol -- SigV4 signing,
        # STS preflight, REST export, account-mismatch enforcement -- against
        # an AWS-compatible endpoint via the SDK's own AWS_ENDPOINT_URL
        # contract. Package-owned docker run, never a GHA services: block.
        run: |
          set -euo pipefail
          start=$SECONDS
          docker run -d --rm --name aws-emulator -p 4566:4566 \
            -e SERVICES=apigateway,sts localstack/localstack:4.9
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:4566/_localstack/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -sf http://127.0.0.1:4566/_localstack/health >/dev/null
          npm run test:emulator:aws
          docker rm -f aws-emulator >/dev/null
          elapsed=$((SECONDS - start))
          echo "emulator lane wall-clock: ${elapsed}s (cap 47s)"
          if [ "$elapsed" -gt 47 ]; then
            echo "::error::AWS emulator lane exceeded its 47s budget (${elapsed}s)"
            exit 1
          fi
      - name: Ensure clean tracked tree outside dist
        run: |
          set -euo pipefail
          outside=()
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            file="${line:3}"
            case "$file" in
              dist/*) ;;
              *) outside+=("$file") ;;
            esac
          done < <(git status --porcelain)
          if [ "${#outside[@]}" -gt 0 ]; then
            echo "Unexpected changes outside dist/:"
            printf '%s\n' "${outside[@]}"
            exit 1
          fi
      - name: Write dist manifest
        run: |
          node <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';

          const lock = readFileSync('package-lock.json');
          writeFileSync(
            'dist-manifest.json',
            `${JSON.stringify(
              {
                repository: process.env.GITHUB_REPOSITORY,
                pull_request: Number(process.env.GITHUB_EVENT_PULL_REQUEST_NUMBER || 0),
                head_sha: process.env.GITHUB_EVENT_NAME === "pull_request" ? JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, "utf8")).pull_request.head.sha : process.env.GITHUB_SHA,
                lock_hash: createHash('sha256').update(lock).digest('hex'),
              },
              null,
              2,
            )}\n`,
          );
          NODE
        env:
          GITHUB_EVENT_PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number || '' }}
      - name: Upload candidate dist
        uses: actions/upload-artifact@v7
        with:
          name: candidate-dist
          path: |
            dist/
            dist-manifest.json

  dist-parity:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm run bundle
      - run: npm run verify:dist:parity
      - name: Upload expected dist on mismatch
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: expected-dist
          path: dist/

  windows:
    name: Windows gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - id: windows-node-modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: Windows/node-24/exact-${{ hashFiles('package-lock.json') }}
      - if: steps.windows-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - run: node --run test

  ready:
    needs: [gate, dist-parity, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs succeeded
        run: |
          echo "gate=${{ needs.gate.result }}"
          echo "dist-parity=${{ needs.dist-parity.result }}"
          echo "windows=${{ needs.windows.result }}"
          for result in "${{ needs.gate.result }}" "${{ needs.dist-parity.result }}" "${{ needs.windows.result }}"; do
            if [ "$result" != "success" ]; then
              echo "CI not ready: one or more required jobs did not succeed"
              exit 1
            fi
          done
          echo "CI ready"
