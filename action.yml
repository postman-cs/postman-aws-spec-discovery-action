name: postman-aws-spec-discovery-action
description: Resolve the best API spec source for the current service repository.
inputs:
  aws-region:
    description: AWS region used to resolve API Gateway resources
    required: true
  gateway-id:
    description: Optional known API Gateway ID for this service. Use this when you want to bypass broader account discovery.
    required: false
    default: ''
  stage:
    description: Optional API Gateway stage override (for example prod or staging).
    required: false
    default: ''
  output-dir:
    description: Directory under the repository root where generated specs are written.
    required: false
    default: discovered-specs
outputs:
  resolution-json:
    description: JSON resolution result describing status, source type, confidence, and evidence.
  resolution-status:
    description: "Resolution status: resolved or unresolved."
  source-type:
    description: "Resolved source type: repo-spec, gateway-export, appsync-schema, eventbridge-schema, cfn-embedded, glue-schema, sns-contract, ssm-registry, manual-review, or discover-many."
  mapping-confidence:
    description: Numeric confidence score for selected service candidate.
  spec-path:
    description: Path to resolved or generated specification when available.
  gateway-id:
    description: Resolved API Gateway ID when available.
  service-name:
    description: Resolved service name.
  services-json:
    description: "Legacy discover-many output: JSON array of exported services."
  service-count:
    description: "Legacy discover-many output: number of exported services."
  export-summary-json:
    description: "discover-many summary JSON with attempted/exported/failed/skipped counts."
  candidates-json:
    description: "JSON array of top candidates when resolution is ambiguous."
  provider-type:
    description: "Provider that resolved the spec: api-gateway, appsync, eventbridge-schemas, cloudformation, glue, sns, or ssm."
  spec-format:
    description: "Format of the resolved spec: openapi-yaml, openapi-json, graphql-sdl, asyncapi-yaml, asyncapi-json, json-schema, avro, or protobuf."
  contract-origin:
    description: "SNS contract provenance when available: repo-asyncapi, repo-json-schema, generated-asyncapi, ssm-content, ssm-url, catalog-url, eventbridge-derived, code-derived, or manual-review."
  contract-metadata-path:
    description: "Path to SNS resolution metadata sidecar when available."
  variant-count:
    description: "Number of SNS delivery variants discovered when available."
runs:
  using: node24
  main: dist/index.cjs
