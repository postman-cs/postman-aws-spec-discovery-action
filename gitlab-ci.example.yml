stages:
  - resolve

variables:
  POSTMAN_AWS_SPEC_DISCOVERY_REF: "v0.3.0"
  POSTMAN_AWS_SPEC_DISCOVERY_DIR: ".tools/postman-aws-spec-discovery-action"

resolve_api_spec:
  image: node:22
  stage: resolve
  script:
    - git clone --depth 1 --branch "$POSTMAN_AWS_SPEC_DISCOVERY_REF" https://github.com/postman-cs/postman-aws-spec-discovery-action.git "$POSTMAN_AWS_SPEC_DISCOVERY_DIR"
    - node "$POSTMAN_AWS_SPEC_DISCOVERY_DIR/dist/cli.cjs" --aws-region "$AWS_REGION" --repo-root "$CI_PROJECT_DIR" --result-json "$CI_PROJECT_DIR/postman-aws-spec-discovery-result.json" --dotenv-path "$CI_PROJECT_DIR/postman-aws-spec-discovery.env"
  artifacts:
    paths:
      - postman-aws-spec-discovery-result.json
      - discovered-specs/
    reports:
      dotenv: postman-aws-spec-discovery.env
