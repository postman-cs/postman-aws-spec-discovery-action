          type: "string"
          description: "user's status on tv provider selection"
          enum:
          - "not_indicated"
          - "no_provider"
          - "not_selected"
          - "<MVPD ID>"
        encryptedProfileId:
          type: "string"
    V1LoginRequest:
      type: "object"
      properties:
        email:
          type: "string"
          description: "Identity Login- Email address associated with user account"
        password:
          type: "string"
          description: "Identity Login- Password associated with user account"
        userType:
          type: "string"
          description: "User Type for determining Login flow, will be inferred from\
            \ body fields if not provided"
        deviceId:
          type: "string"
          description: "Anonymous Login- Device Id or UUID for anonymous login"
        device_id:
          type: "string"
          description: "Anonymous Login- Alias for deviceId"
        idfv:
          type: "string"
          description: "Anonymous Login- Alias for deviceId"
        anonymous:
          type: "string"
          description: "Anonymous Login- Alias for deviceId"
        facebookToken:
          type: "string"
          description: "Social Login-"
        appleToken:
          type: "string"
          description: "Apple Sign-in Token"
        googleToken:
          type: "string"
          description: "Google Sign-in Token"
        isTermsOfServiceAgreementNeeded:
          type: "boolean"
          description: "Indicates a user needs to accept the TOS before login is allowed"
        clientId:
          type: "string"
          description: "clientId provided by client"
        receipts:
          type: "object"
          properties:
            appstore:
              type: "array"
              items:
                type: "object"
                properties:
                  receiptData:
                    type: "string"
            playstore:
              type: "array"
              items:
                type: "object"
                properties:
                  token:
                    type: "string"
                  subscriptionID:
                    type: "string"
                  packageName:
                    type: "string"
            amazonstore:
              type: "array"
              items:
                type: "object"
                properties:
                  receiptID:
                    type: "string"
                  userID:
                    type: "string"
        recaptchaToken:
          type: "string"
          description: "reCAPTCHA token to be validated when available"
        rokuId:
          type: "string"
          description: "id generated by Roku cloud. Forwarded to the rokuauthn service.\
            \ Required for Roku login flow."
        rokuToken:
          type: "string"
          description: "token generated by Roku cloud. Forwarded to the rokuauthn\
            \ service. Required for Roku login flow."
        purchaseTransactionId:
          type: "string"
          description: "purchase transaction id for Roku Instant Login flow. Required\
            \ for Roku Instant Login flow."
      description: "Fields are required or optional based on login flow"
    V2TokenExchangeResponse:
      type: "object"
      properties:
        accessToken:
          type: "string"
          description: "JWT Access Token. This token has information regarding the\
            \ session ID etc which holds most of the information of this user. Interaction\
            \ required with Session Service to get data"
        refreshToken:
          type: "string"
          description: "JWT Refresh Token. For security purposes, access tokens may\
            \ be valid for a short amount of time. Once they expire, client applications\
            \ can use a refresh token to refresh the access token"
