          type: "string"
        profileId:
          type: "string"
        deviceId:
          type: "string"
        email:
          type: "string"
        accountType:
          type: "string"
        userType:
          type: "string"
        brand:
          type: "string"
        platform:
          type: "string"
        isVerified:
          type: "boolean"
        newsLetter:
          type: "boolean"
        hasSocialLogin:
          type: "boolean"
        hasEmail:
          type: "boolean"
        device:
          type: "string"
        viewerId:
          type: "string"
        dma:
          type: "string"
        ipAddress:
          type: "string"
        userAgent:
          type: "string"
        gender:
          type: "string"
        firstName:
          type: "string"
        lastName:
          type: "string"
