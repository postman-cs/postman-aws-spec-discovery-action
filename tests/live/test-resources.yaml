AWSTemplateFormatVersion: '2010-09-09'
Description: Temporary test resources for multi-provider spec discovery validation

Resources:
  # 1. REST API Gateway with embedded OpenAPI spec
  TestRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: spec-discovery-test-rest
      Description: Test REST API for spec discovery
      Body:
        openapi: '3.0.1'
        info:
          title: spec-discovery-test-rest
          version: '1.0.0'
        paths:
          /health:
            get:
              summary: Health check
              responses:
                '200':
                  description: OK
                  content:
                    application/json:
                      schema:
                        type: object
                        properties:
                          status:
                            type: string
              x-amazon-apigateway-integration:
                type: MOCK
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: '{"status":"ok"}'
      Tags:
        - Key: postman:project-name
          Value: spec-discovery-test
        - Key: env
          Value: test

  TestRestDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: TestRestApi
    Properties:
      RestApiId: !Ref TestRestApi

  TestRestStageProd:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref TestRestApi
      DeploymentId: !Ref TestRestDeployment
      StageName: prod

  # 2. HTTP API Gateway
  TestHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: spec-discovery-test-http
      ProtocolType: HTTP
      Description: Test HTTP API for spec discovery
      Tags:
        postman:project-name: spec-discovery-test-http

  TestHttpStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref TestHttpApi
      StageName: '$default'
      AutoDeploy: true

  # 3. WebSocket API Gateway
  TestWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: spec-discovery-test-websocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      Description: Test WebSocket API for spec discovery
      Tags:
        postman:project-name: spec-discovery-test-ws

  # 4. AppSync GraphQL API
  TestGraphqlApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: spec-discovery-test-graphql
      AuthenticationType: API_KEY
      Tags:
        - Key: postman:project-name
          Value: spec-discovery-test-graphql

  TestGraphqlSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt TestGraphqlApi.ApiId
      Definition: |
        type Query {
          getItem(id: ID!): Item
          listItems: [Item]
        }
        type Mutation {
          createItem(input: CreateItemInput!): Item
        }
        type Item {
          id: ID!
          name: String!
          description: String
          createdAt: String
        }
        input CreateItemInput {
          name: String!
          description: String
        }

  # 5. EventBridge Schema Registry with custom schema
  TestSchemaRegistry:
    Type: AWS::EventSchemas::Registry
    Properties:
      RegistryName: spec-discovery-test-registry
      Description: Test registry for spec discovery
      Tags:
        - Key: env
          Value: test

  TestEventSchema:
    Type: AWS::EventSchemas::Schema
    Properties:
      RegistryName: !GetAtt TestSchemaRegistry.RegistryName
      SchemaName: spec-discovery-test.OrderCreated
      Type: OpenApi3
      Description: Test event schema
      Content: >
        {"openapi":"3.0.0","info":{"title":"OrderCreated","version":"1.0.0"},"paths":{},"components":{"schemas":{"OrderCreated":{"type":"object","properties":{"orderId":{"type":"string"},"customerId":{"type":"string"},"amount":{"type":"number"},"createdAt":{"type":"string","format":"date-time"}},"required":["orderId","customerId","amount"]}}}}

  # 6. Glue Schema Registry with Avro schema
  TestGlueRegistry:
    Type: AWS::Glue::Registry
    Properties:
      Name: spec-discovery-test-glue-registry
      Description: Test Glue registry for spec discovery

  TestGlueSchema:
    Type: AWS::Glue::Schema
    Properties:
      Registry:
        Name: spec-discovery-test-glue-registry
      Name: spec-discovery-test-user-event
      DataFormat: AVRO
      Compatibility: NONE
      SchemaDefinition: >
        {"type":"record","name":"UserEvent","namespace":"com.example.test","fields":[{"name":"userId","type":"string"},{"name":"action","type":"string"},{"name":"timestamp","type":"long"}]}

  # 7. SNS standard topic
  SpecDiscoveryTestTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpecDiscoveryTestTopic

  # 8. SNS tagged topic
  SpecDiscoveryTaggedTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpecDiscoveryTaggedTopic
      Tags:
        - Key: postman:project-name
          Value: test-service

  # 9. SNS FIFO topic
  SpecDiscoveryFifoTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpecDiscoveryTestTopic.fifo
      FifoTopic: true
      ContentBasedDeduplication: true

  # 10. SNS topic with SQS subscription
  SpecDiscoverySubscriptionTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpecDiscoverySubscribedTopic

  SpecDiscoverySubscriptionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SpecDiscoverySubscriptionQueue

  SpecDiscoveryQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SpecDiscoverySubscriptionQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSnsPublish
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SpecDiscoverySubscriptionQueue.Arn
            Condition:
              ArnEquals:
                'aws:SourceArn': !Ref SpecDiscoverySubscriptionTopic

  SpecDiscoverySqsSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: SpecDiscoveryQueuePolicy
    Properties:
      TopicArn: !Ref SpecDiscoverySubscriptionTopic
      Protocol: sqs
      Endpoint: !GetAtt SpecDiscoverySubscriptionQueue.Arn

  SpecDiscoveryRawSubscriptionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SpecDiscoveryRawSubscriptionQueue

  SpecDiscoveryRawQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SpecDiscoveryRawSubscriptionQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSnsPublishRaw
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SpecDiscoveryRawSubscriptionQueue.Arn
            Condition:
              ArnEquals:
                'aws:SourceArn': !Ref SpecDiscoverySubscriptionTopic

  SpecDiscoveryRawSqsSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: SpecDiscoveryRawQueuePolicy
    Properties:
      TopicArn: !Ref SpecDiscoverySubscriptionTopic
      Protocol: sqs
      Endpoint: !GetAtt SpecDiscoveryRawSubscriptionQueue.Arn
      RawMessageDelivery: true

  SpecDiscoveryHttpsSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref SpecDiscoverySubscriptionTopic
      Protocol: https
      Endpoint: https://example.com/sns-webhook-test

  # 11. SSM contract pointers for SNS resolution
  SpecDiscoveryTopicContractFormat:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-test-topic/format
      Type: String
      Value: asyncapi-yaml

  SpecDiscoveryTopicContractContent:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-test-topic/content
      Type: String
      Value: |
        asyncapi: 2.6.0
        info:
          title: Spec Discovery Test Topic Contract
          version: 1.0.0
        channels:
          spec-discovery-test-topic:
            description: Sample contract for SNS live testing
            subscribe:
              message:
                contentType: application/json
                payload:
                  type: object
                  required:
                    - eventType
                    - message
                  properties:
                    eventType:
                      type: string
                    message:
                      type: string

  SpecDiscoveryUrlTopicContractUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-url-topic/spec-url
      Type: String
      Value: https://json.schemastore.org/package

  SpecDiscoveryUrlTopicContractFormat:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-url-topic/spec-format
      Type: String
      Value: json-schema

Outputs:
  RestApiId:
    Value: !Ref TestRestApi
  HttpApiId:
    Value: !Ref TestHttpApi
  WebSocketApiId:
    Value: !Ref TestWebSocketApi
  GraphqlApiId:
    Value: !GetAtt TestGraphqlApi.ApiId
  SchemaRegistryName:
    Value: !GetAtt TestSchemaRegistry.RegistryName
  GlueRegistryName:
    Value: !Ref TestGlueRegistry
  SnsTestTopicArn:
    Value: !Ref SpecDiscoveryTestTopic
  SnsTaggedTopicArn:
    Value: !Ref SpecDiscoveryTaggedTopic
  SnsFifoTopicArn:
    Value: !Ref SpecDiscoveryFifoTopic
  SnsSubscriptionTopicArn:
    Value: !Ref SpecDiscoverySubscriptionTopic
