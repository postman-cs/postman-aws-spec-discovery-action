# Mirrors the live validation stack used by tests/live/test-resources.yaml.
# Keep this copy focused on validation/runbook reproduction; test changes should be
# reconciled back into this fixture when live coverage expands.
AWSTemplateFormatVersion: '2010-09-09'
Description: Live resources for AWS spec discovery validation

Parameters:
  AlbVpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing VPC used only for the internal ALB validation resource.
  AlbSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two existing subnet IDs in different Availability Zones for the internal ALB validation resource.

Resources:
  TestRestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: spec-discovery-validation-rest
      Body:
        openapi: '3.0.1'
        info:
          title: spec-discovery-validation-rest
          version: '1.0.0'
        paths:
          /health:
            get:
              responses:
                '200':
                  description: OK
              x-amazon-apigateway-integration:
                type: MOCK
                requestTemplates:
                  application/json: '{"statusCode": 200}'
                responses:
                  default:
                    statusCode: '200'
                    responseTemplates:
                      application/json: '{"status":"ok"}'
      Tags:
        - Key: postman:project-name
          Value: spec-discovery-validation

  TestRestDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: TestRestApi
    Properties:
      RestApiId: !Ref TestRestApi

  TestRestStageProd:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref TestRestApi
      DeploymentId: !Ref TestRestDeployment
      StageName: prod

  TestHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: spec-discovery-validation-http
      ProtocolType: HTTP
      Tags:
        postman:project-name: spec-discovery-validation-http

  TestHttpIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref TestHttpApi
      IntegrationType: HTTP_PROXY
      IntegrationMethod: ANY
      IntegrationUri: https://example.com/{proxy}
      PayloadFormatVersion: '1.0'

  TestHttpRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref TestHttpApi
      RouteKey: 'ANY /{proxy+}'
      Target: !Sub integrations/${TestHttpIntegration}

  TestHttpDeployment:
    Type: AWS::ApiGatewayV2::Deployment
    DependsOn: TestHttpRoute
    Properties:
      ApiId: !Ref TestHttpApi

  TestHttpStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref TestHttpApi
      DeploymentId: !Ref TestHttpDeployment
      StageName: '$default'

  TestWebSocketApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: spec-discovery-validation-websocket
      ProtocolType: WEBSOCKET
      RouteSelectionExpression: $request.body.action
      Tags:
        postman:project-name: spec-discovery-validation-ws

  TestWebSocketOrderModel:
    Type: AWS::ApiGatewayV2::Model
    Properties:
      ApiId: !Ref TestWebSocketApi
      Name: OrderMessage
      ContentType: application/json
      Schema:
        type: object
        required:
          - orderId
        properties:
          action:
            type: string
          messageType:
            type: string
          orderId:
            type: string

  TestWebSocketAckModel:
    Type: AWS::ApiGatewayV2::Model
    Properties:
      ApiId: !Ref TestWebSocketApi
      Name: OrderAck
      ContentType: application/json
      Schema:
        type: object
        properties:
          accepted:
            type: boolean

  TestWebSocketIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref TestWebSocketApi
      IntegrationType: HTTP
      IntegrationMethod: POST
      IntegrationUri: https://example.com/websocket-validation
      RequestTemplates:
        application/json: '{"statusCode": 200}'
      TemplateSelectionExpression: $request.body.template
      TimeoutInMillis: 29000

  TestWebSocketRoute:
    Type: AWS::ApiGatewayV2::Route
    DependsOn:
      - TestWebSocketOrderModel
      - TestWebSocketIntegration
    Properties:
      ApiId: !Ref TestWebSocketApi
      RouteKey: sendMessage
      AuthorizationType: NONE
      OperationName: sendOrderMessage
      ModelSelectionExpression: $request.body.messageType
      RequestModels:
        application/json: OrderMessage
      RouteResponseSelectionExpression: $default
      Target: !Sub integrations/${TestWebSocketIntegration}

  TestWebSocketRouteResponse:
    Type: AWS::ApiGatewayV2::RouteResponse
    DependsOn:
      - TestWebSocketAckModel
      - TestWebSocketRoute
    Properties:
      ApiId: !Ref TestWebSocketApi
      RouteId: !Ref TestWebSocketRoute
      RouteResponseKey: '$default'
      ModelSelectionExpression: $request.body.messageType
      ResponseModels:
        application/json: OrderAck

  TestGraphqlApi:
    Type: AWS::AppSync::GraphQLApi
    Properties:
      Name: spec-discovery-validation-graphql
      AuthenticationType: API_KEY
      Tags:
        - Key: postman:project-name
          Value: spec-discovery-validation-graphql

  TestGraphqlSchema:
    Type: AWS::AppSync::GraphQLSchema
    Properties:
      ApiId: !GetAtt TestGraphqlApi.ApiId
      Definition: |
        type Query {
          getItem(id: ID!): Item
          listItems: [Item]
        }
        type Item {
          id: ID!
          name: String!
        }

  TestSchemaRegistry:
    Type: AWS::EventSchemas::Registry
    Properties:
      RegistryName: spec-discovery-validation-registry

  TestEventSchema:
    Type: AWS::EventSchemas::Schema
    Properties:
      RegistryName: !GetAtt TestSchemaRegistry.RegistryName
      SchemaName: spec-discovery-validation.OrderCreated
      Type: OpenApi3
      Content: >
        {"openapi":"3.0.0","info":{"title":"OrderCreated","version":"1.0.0"},"paths":{},"components":{"schemas":{"OrderCreated":{"type":"object","properties":{"orderId":{"type":"string"}}}}}}

  TestGlueRegistry:
    Type: AWS::Glue::Registry
    Properties:
      Name: spec-discovery-validation-glue-registry

  TestGlueSchema:
    Type: AWS::Glue::Schema
    Properties:
      Registry:
        Name: spec-discovery-validation-glue-registry
      Name: spec-discovery-validation-user-event
      DataFormat: AVRO
      Compatibility: NONE
      SchemaDefinition: >
        {"type":"record","name":"UserEvent","namespace":"com.example.test","fields":[{"name":"userId","type":"string"},{"name":"action","type":"string"}]}

  TestLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: confirm-sns-subscriptions
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:ConfirmSubscription
                Resource: !Ref SpecDiscoverySubscriptionTopic
        - PolicyName: consume-validation-sqs-events
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ChangeMessageVisibility
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ReceiveMessage
                Resource: !GetAtt SpecDiscoveryLambdaEventSourceQueue.Arn

  TestLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: spec-discovery-validation-lambda-url
      Runtime: nodejs22.x
      Handler: index.handler
      Role: !GetAtt TestLambdaRole.Arn
      Code:
        ZipFile: |
          exports.handler = async () => ({ statusCode: 200, body: JSON.stringify({ ok: true }) });
      Tags:
        - Key: postman:project-name
          Value: spec-discovery-validation-lambda-url

  TestLambdaFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt TestLambdaFunction.Arn
      AuthType: AWS_IAM
      Cors:
        AllowMethods:
          - GET
          - POST
        AllowOrigins:
          - '*'

  SpecDiscoveryTestTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpecDiscoveryValidationTopic

  SpecDiscoveryUrlTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpecDiscoveryValidationUrlTopic

  SpecDiscoverySubscriptionTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: SpecDiscoveryValidationSubscribedTopic

  SpecDiscoverySnsConfirmFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: spec-discovery-validation-sns-confirm
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt TestLambdaRole.Arn
      Timeout: 10
      Code:
        ZipFile: |
          import base64
          import json
          import boto3

          sns = boto3.client("sns")

          def handler(event, context):
              body = event.get("body") or "{}"
              if event.get("isBase64Encoded"):
                  body = base64.b64decode(body).decode("utf-8")
              try:
                  message = json.loads(body)
              except Exception:
                  message = {}
              if message.get("Type") == "SubscriptionConfirmation":
                  sns.confirm_subscription(
                      TopicArn=message["TopicArn"],
                      Token=message["Token"],
                      AuthenticateOnUnsubscribe="false"
                  )
              return {"statusCode": 200, "body": "ok"}

  SpecDiscoverySnsConfirmHttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: spec-discovery-validation-sns-confirm
      ProtocolType: HTTP

  SpecDiscoverySnsConfirmIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref SpecDiscoverySnsConfirmHttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt SpecDiscoverySnsConfirmFunction.Arn
      PayloadFormatVersion: '2.0'

  SpecDiscoverySnsConfirmRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref SpecDiscoverySnsConfirmHttpApi
      RouteKey: 'POST /sns-confirm'
      Target: !Sub integrations/${SpecDiscoverySnsConfirmIntegration}

  SpecDiscoverySnsConfirmStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref SpecDiscoverySnsConfirmHttpApi
      StageName: '$default'
      AutoDeploy: true

  SpecDiscoverySnsConfirmInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SpecDiscoverySnsConfirmFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${SpecDiscoverySnsConfirmHttpApi}/*/POST/sns-confirm

  SpecDiscoverySubscriptionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SpecDiscoveryValidationSubscriptionQueue

  SpecDiscoveryQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SpecDiscoverySubscriptionQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSnsPublish
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SpecDiscoverySubscriptionQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref SpecDiscoverySubscriptionTopic

  SpecDiscoverySqsSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: SpecDiscoveryQueuePolicy
    Properties:
      TopicArn: !Ref SpecDiscoverySubscriptionTopic
      Protocol: sqs
      Endpoint: !GetAtt SpecDiscoverySubscriptionQueue.Arn

  SpecDiscoveryRawSubscriptionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SpecDiscoveryValidationRawSubscriptionQueue

  SpecDiscoveryRawQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SpecDiscoveryRawSubscriptionQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSnsPublishRaw
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SpecDiscoveryRawSubscriptionQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref SpecDiscoverySubscriptionTopic

  SpecDiscoveryRawSqsSubscription:
    Type: AWS::SNS::Subscription
    DependsOn: SpecDiscoveryRawQueuePolicy
    Properties:
      TopicArn: !Ref SpecDiscoverySubscriptionTopic
      Protocol: sqs
      Endpoint: !GetAtt SpecDiscoveryRawSubscriptionQueue.Arn
      RawMessageDelivery: true

  SpecDiscoveryHttpsSubscriptionDlq:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SpecDiscoveryValidationHttpsSubscriptionDlq

  SpecDiscoveryHttpsSubscriptionDlqPolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref SpecDiscoveryHttpsSubscriptionDlq
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSnsPublishHttpsDlq
            Effect: Allow
            Principal:
              Service: sns.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt SpecDiscoveryHttpsSubscriptionDlq.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !Ref SpecDiscoverySubscriptionTopic

  SpecDiscoveryHttpsSubscription:
    Type: AWS::SNS::Subscription
    DependsOn:
      - SpecDiscoveryHttpsSubscriptionDlqPolicy
      - SpecDiscoverySnsConfirmInvokePermission
      - SpecDiscoverySnsConfirmStage
    Properties:
      TopicArn: !Ref SpecDiscoverySubscriptionTopic
      Protocol: https
      Endpoint: !Sub https://${SpecDiscoverySnsConfirmHttpApi}.execute-api.${AWS::Region}.amazonaws.com/sns-confirm
      FilterPolicy:
        eventType:
          - order.created
      FilterPolicyScope: MessageBody
      DeliveryPolicy:
        healthyRetryPolicy:
          minDelayTarget: 1
          maxDelayTarget: 2
          numRetries: 3
          numMaxDelayRetries: 1
          numMinDelayRetries: 1
          numNoDelayRetries: 0
          backoffFunction: linear
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SpecDiscoveryHttpsSubscriptionDlq.Arn

  SpecDiscoveryTopicContractFormat:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-validation-topic/format
      Type: String
      Value: asyncapi-yaml

  SpecDiscoveryTopicContractContent:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-validation-topic/content
      Type: String
      Value: |
        asyncapi: 2.6.0
        info:
          title: Spec Discovery Validation Topic Contract
          version: 1.0.0
        channels:
          spec-discovery-validation-topic:
            subscribe:
              message:
                payload:
                  type: object

  SpecDiscoveryUrlTopicContractUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-validation-url-topic/spec-url
      Type: String
      Value: https://json.schemastore.org/package

  SpecDiscoveryUrlTopicContractFormat:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-validation-url-topic/spec-format
      Type: String
      Value: json-schema

  SpecDiscoverySubscribedTopicContractFormat:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-validation-subscribed-topic/format
      Type: String
      Value: asyncapi-yaml

  SpecDiscoverySubscribedTopicContractContent:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-validation-subscribed-topic/content
      Type: String
      Value: |
        asyncapi: 2.6.0
        info:
          title: Spec Discovery Validation Subscribed Topic Contract
          version: 1.0.0
        channels:
          spec-discovery-validation-subscribed-topic:
            subscribe:
              message:
                payload:
                  type: object

  SpecDiscoveryPointerContractUrl:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-validation-pointer/spec-url
      Type: String
      Value: https://example.invalid/openapi.yaml

  SpecDiscoveryPointerContractFormat:
    Type: AWS::SSM::Parameter
    Properties:
      Name: /postman/specs/spec-discovery-validation-pointer/spec-format
      Type: String
      Value: openapi-yaml

  TestEventApi:
    Type: AWS::AppSync::Api
    Properties:
      Name: spec-discovery-validation-events
      EventConfig:
        AuthProviders:
          - AuthType: AWS_IAM
        ConnectionAuthModes:
          - AuthType: AWS_IAM
        DefaultPublishAuthModes:
          - AuthType: AWS_IAM
        DefaultSubscribeAuthModes:
          - AuthType: AWS_IAM
      Tags:
        - Key: postman:project-name
          Value: spec-discovery-validation-events

  TestEventChannelNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt TestEventApi.ApiId
      Name: orders
      PublishAuthModes:
        - AuthType: AWS_IAM
      SubscribeAuthModes:
        - AuthType: AWS_IAM
      Tags:
        - Key: postman:project-name
          Value: spec-discovery-validation-events

  TestEventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: spec-discovery-validation-orders-rule
      Description: Live validation rule for AWS spec discovery metadata derivation.
      EventPattern:
        source:
          - spec.discovery.validation
        detail-type:
          - Order Created
        detail:
          eventType:
            - order.created
      State: DISABLED
      Targets:
        - Arn: !GetAtt TestLambdaFunction.Arn
          Id: LambdaValidationTarget

  TestEventBridgeRuleLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref TestLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt TestEventBridgeRule.Arn

  TestEventBridgeConnection:
    Type: AWS::Events::Connection
    Properties:
      Name: spec-discovery-validation-orders-connection
      AuthorizationType: API_KEY
      AuthParameters:
        ApiKeyAuthParameters:
          ApiKeyName: x-api-key
          ApiKeyValue: validation-key

  TestEventBridgeApiDestination:
    Type: AWS::Events::ApiDestination
    Properties:
      Name: spec-discovery-validation-orders-destination
      ConnectionArn: !GetAtt TestEventBridgeConnection.Arn
      InvocationEndpoint: https://example.com/orders
      HttpMethod: POST
      InvocationRateLimitPerSecond: 5

  SpecDiscoveryPipeQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SpecDiscoveryValidationPipeQueue

  SpecDiscoveryPipeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: pipes.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: pipe-source-and-target
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ReceiveMessage
                Resource: !GetAtt SpecDiscoveryPipeQueue.Arn
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt TestLambdaFunction.Arn

  TestEventBridgePipe:
    Type: AWS::Pipes::Pipe
    Properties:
      Name: spec-discovery-validation-orders-pipe
      RoleArn: !GetAtt SpecDiscoveryPipeRole.Arn
      Source: !GetAtt SpecDiscoveryPipeQueue.Arn
      SourceParameters:
        FilterCriteria:
          Filters:
            - Pattern: '{"body":{"eventType":["order.created"]}}'
        SqsQueueParameters:
          BatchSize: 1
      Target: !GetAtt TestLambdaFunction.Arn
      DesiredState: STOPPED

  SpecDiscoveryLambdaEventSourceQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: SpecDiscoveryValidationLambdaEventSourceQueue

  TestLambdaEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref TestLambdaFunction
      EventSourceArn: !GetAtt SpecDiscoveryLambdaEventSourceQueue.Arn
      BatchSize: 5
      Enabled: false
      FilterCriteria:
        Filters:
          - Pattern: '{"body":{"eventType":["order.created"]}}'

  TestVerifiedPermissionsPolicyStore:
    Type: AWS::VerifiedPermissions::PolicyStore
    Properties:
      Description: spec-discovery-validation-authz
      ValidationSettings:
        Mode: STRICT
      Schema:
        CedarJson: |
          {
            "SpecDiscovery": {
              "entityTypes": {
                "User": {
                  "shape": {
                    "type": "Record",
                    "attributes": {
                      "id": {
                        "type": "String"
                      }
                    }
                  }
                },
                "Order": {
                  "shape": {
                    "type": "Record",
                    "attributes": {
                      "orderId": {
                        "type": "String"
                      }
                    }
                  }
                }
              },
              "actions": {
                "ViewOrder": {
                  "appliesTo": {
                    "principalTypes": [
                      "User"
                    ],
                    "resourceTypes": [
                      "Order"
                    ]
                  }
                }
              }
            }
          }

  TestStepFunctionsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole

  TestStepFunctionsStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: spec-discovery-validation-orders-workflow
      StateMachineType: STANDARD
      RoleArn: !GetAtt TestStepFunctionsRole.Arn
      DefinitionString: |
        {
          "Comment": "Live validation state machine for AWS spec discovery metadata derivation.",
          "StartAt": "ValidateOrder",
          "States": {
            "ValidateOrder": {
              "Type": "Pass",
              "Result": {
                "status": "validated"
              },
              "End": true
            }
          }
        }

  TestAlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for spec discovery validation ALB.
      VpcId: !Ref AlbVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 10.0.0.0/8

  TestApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: spec-discovery-validation-alb
      Type: application
      Scheme: internal
      SecurityGroups:
        - !Ref TestAlbSecurityGroup
      Subnets: !Ref AlbSubnetIds

  TestAlbListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref TestApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '404'
            ContentType: application/json
            MessageBody: '{"status":"not-found"}'

  TestAlbListenerRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref TestAlbListener
      Priority: 10
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values:
              - orders.internal.example.com
        - Field: path-pattern
          PathPatternConfig:
            Values:
              - /orders/*
        - Field: http-request-method
          HttpRequestMethodConfig:
            Values:
              - GET
              - POST
        - Field: query-string
          QueryStringConfig:
            Values:
              - Key: status
                Value: open
      Actions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: '200'
            ContentType: application/json
            MessageBody: '{"status":"ok"}'

  TestBedrockAgentRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: bedrock.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-foundation-models
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/*

  TestBedrockAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: spec_discovery_validation_agent
      Description: Live validation agent for AWS spec discovery action group derivation.
      AgentResourceRoleArn: !GetAtt TestBedrockAgentRole.Arn
      FoundationModel: anthropic.claude-3-haiku-20240307-v1:0
      Instruction: Validate order API metadata for the AWS spec discovery live validation stack without calling external systems.
      AutoPrepare: false
      ActionGroups:
        - ActionGroupName: orders_api
          Description: Inline OpenAPI action group for live validation.
          ActionGroupState: ENABLED
          ActionGroupExecutor:
            CustomControl: RETURN_CONTROL
          ApiSchema:
            Payload: |
              {
                "openapi": "3.0.0",
                "info": {
                  "title": "Orders Action Group",
                  "version": "1.0.0",
                  "description": "Validation API for deriving Bedrock Agent action group OpenAPI metadata."
                },
                "paths": {
                  "/orders": {
                    "post": {
                      "operationId": "createOrder",
                      "summary": "Create an order",
                      "description": "Create an order for the validation fixture and return the accepted order identifier.",
                      "requestBody": {
                        "required": true,
                        "content": {
                          "application/json": {
                            "schema": {
                              "type": "object",
                              "properties": {
                                "orderId": {
                                  "type": "string",
                                  "description": "Unique order identifier."
                                }
                              },
                              "required": [
                                "orderId"
                              ]
                            }
                          }
                        }
                      },
                      "responses": {
                        "200": {
                          "description": "Order accepted",
                          "content": {
                            "application/json": {
                              "schema": {
                                "type": "object",
                                "properties": {
                                  "accepted": {
                                    "type": "boolean",
                                    "description": "Whether the order was accepted."
                                  }
                                }
                              }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }

Outputs:
  RestApiId:
    Value: !Ref TestRestApi
  HttpApiId:
    Value: !Ref TestHttpApi
